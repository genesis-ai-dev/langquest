appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  - setAirplaneMode: disabled
---
# Download control is disabled for cloud-only quests while offline. After a
# download, tapping it offline opens the undownload warning; cancel leaves
# the quest downloaded, confirm offloads. Android only.
- evalScript: ${output.ownerEmail = output.api.uniqueEmail("offgateowner")}
- evalScript: ${output.ownerPassword = output.api.uniquePassword("offgateowner")}
- evalScript: ${output.projectName = "maestro-offgate-" + Date.now()}
- evalScript: ${output.questName = "maestro-offgate-q-" + Date.now()}
- evalScript: ${output.assetName = "maestro-offgate-a-" + Date.now()}
- evalScript: ${output.skipSignInCleanup = true}
- evalScript: ${output.api.createConfirmedUser(output.ownerEmail, output.ownerPassword)}
- evalScript: ${output.api.seedProject(output.projectName, output.ownerEmail, false)}
- evalScript: ${output.api.seedQuest(output.projectName, output.questName, output.ownerEmail, true)}
- evalScript: ${output.api.seedSourceAsset(output.projectName, output.questName, output.ownerEmail, output.assetName, "Gate source")}
- runFlow: _start-signed-in.yaml
- tapOn:
    id: projects-tab-all
- tapOn:
    id: projects-search
- inputText: ${output.projectName}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.projectName}
    timeout: 45000
- tapOn:
    text: ${output.projectName}
    below:
      id: projects-search
- extendedWaitUntil:
    visible:
      id: quest-list-item
    timeout: 45000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: quest-list-item
      - extendedWaitUntil:
          visible: '(?i)Download Now'
          timeout: 15000
      - tapOn: '(?i)^Cancel$'
      - setAirplaneMode: disabled
- tapOn:
    id: quest-list-item
- runFlow:
    when:
      visible:
        id: quest-list-item
      notVisible: '(?i)Download Now'
    commands:
      - tapOn:
          id: quest-list-item
- extendedWaitUntil:
    visible: '(?i)Download Now'
    timeout: 15000
- tapOn:
    text: '(?i)Download Now'
- extendedWaitUntil:
    visible: Continue to Download
    timeout: 45000
- tapOn:
    id: quest-download-continue
- extendedWaitUntil:
    visible:
      id: quest-download-confirm
    timeout: 20000
- tapOn:
    id: quest-download-confirm
- evalScript: ${output.api.waitForQuestDownload(output.questName, output.signInEmail, true)}
- extendedWaitUntil:
    notVisible:
      id: quest-download-confirm
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: quest-download-continue
    timeout: 15000
- tapOn:
    id: quest-list-item
- repeat:
    times: 6
    while:
      visible: '(?i)Download Now'
    commands:
      - tapOn: '(?i)^Cancel$'
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn:
          id: quest-list-item
- extendedWaitUntil:
    visible:
      id: assets-refresh-button
    timeout: 45000
- tapOn:
    id: nav-back
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: quest-download
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: quest-download
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible:
            id: offline-undownload-warning
          timeout: 15000
      - tapOn:
          id: offline-undownload-cancel
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          notVisible:
            id: offline-undownload-warning
          timeout: 10000
      - tapOn:
          id: quest-download
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible:
            id: offline-undownload-confirm
          timeout: 15000
      - tapOn:
          id: offline-undownload-confirm
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible: Ready to offload
          timeout: 45000
      - scrollUntilVisible:
          element:
            id: quest-offload-continue
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: quest-offload-continue
      - setAirplaneMode: disabled
      - evalScript: ${output.api.waitForQuestDownload(output.questName, output.signInEmail, false)}
- evalScript: ${output.api.deleteProject(output.projectName)}
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
- evalScript: ${output.api.deleteUserIfExists(output.ownerEmail)}
