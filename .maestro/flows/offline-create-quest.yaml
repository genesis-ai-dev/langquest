appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
# Always restore radios. Airplane mode cuts Metro and Docker reachability
# from the device; leaving it on would fail every flow after this one.
onFlowComplete:
  - setAirplaneMode: disabled
---
# 5.3 create a quest while offline then wait until it lands on the server.
# 5.4 open the drawer while radios are down and leave via Projects. Android
# only — iOS Simulator has no airplane mode.
- evalScript: ${output.projectName = "maestro-offproj-" + Date.now()}
- evalScript: ${output.questName = "maestro-offquest-" + Date.now()}
- evalScript: ${output.skipSignInCleanup = true}
- runFlow: _start-signed-in.yaml
- evalScript: ${output.api.seedProject(output.projectName, output.signInEmail, false)}
- runFlow: _open-named-project.yaml
- extendedWaitUntil:
    visible:
      id: quest-create-button
    timeout: 45000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - runFlow: _open-app-drawer.yaml
      - extendedWaitUntil:
          visible: '(?i)(Disconnected|sync error)'
          timeout: 20000
      - tapOn:
          id: drawer-projects
          waitToSettleTimeoutMs: 0
      - tapOn:
          id: projects-tab-my
          waitToSettleTimeoutMs: 0
      - tapOn:
          id: projects-search
      - eraseText: 200
      - eraseText: 200
      - inputText: ${output.projectName}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.projectName}
          timeout: 20000
      - tapOn:
          text: ${output.projectName}
          below:
            id: projects-search
      - extendedWaitUntil:
          visible:
            id: quest-create-button
          timeout: 20000
      - tapOn:
          id: quest-create-button
          waitToSettleTimeoutMs: 0
      - tapOn:
          id: quest-create-name
          waitToSettleTimeoutMs: 0
      - inputText: ${output.questName}
      # IME covers the drawer footer. Keyboard is up after inputText, so
      # hideKeyboard dismisses it instead of acting as Back.
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: quest-create-submit
          timeout: 15000
      - tapOn:
          id: quest-create-submit
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible:
            id: quest-list-item
          timeout: 20000
      - extendedWaitUntil:
          notVisible:
            id: quest-create-name
          timeout: 15000
      - setAirplaneMode: disabled
      - evalScript: ${output.api.waitForQuest(output.questName, 45000)}
- evalScript: ${output.api.deleteProject(output.projectName)}
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
