appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      android.permission.RECORD_AUDIO: allow
      microphone: allow
# Development client only. clearState wipes the last Metro URL, so the
# Expo Dev Launcher / Dev Menu opens instead of LangQuest. EAS preview
# and production builds skip this (MAESTRO_USE_DEV_CLIENT is unset).
- evalScript: ${output.useDevClient = typeof MAESTRO_USE_DEV_CLIENT !== 'undefined' && String(MAESTRO_USE_DEV_CLIENT) === 'true'}
- runFlow:
    when:
      true: ${output.useDevClient}
    commands:
      - openLink: ${MAESTRO_DEV_CLIENT_URL}
# The Dev Launcher recents list, the first-run Dev Menu ("Continue"), and
# the Dev Menu sheet appear at unpredictable moments while Metro loads the
# bundle. Keep dismissing whatever is on screen until the app's own Terms
# screen shows. A single `when:` check races the bundle load.
- repeat:
    times: 20
    while:
      notVisible: Terms & Privacy
    commands:
      - runFlow:
          when:
            visible: 'http://.*'
          commands:
            - tapOn: 'http://.*'
      - runFlow:
          when:
            visible: Continue
            notVisible: I agree
          commands:
            - tapOn: Continue
      - runFlow:
          when:
            visible: Toggle performance monitor
          commands:
            - swipe:
                direction: DOWN
- assertVisible: Terms & Privacy
- scrollUntilVisible:
    element: I agree
- tapOn:
    text: I agree
    waitToSettleTimeoutMs: 0 # stop waiting for onboarding animation
- assertVisible:
    text: Every language. Every culture.
    waitToSettleTimeoutMs: 0 # stop waiting for onboarding animation
- tapOn:
    id: onboarding-close-button
    waitToSettleTimeoutMs: 0 # stop waiting for onboarding animation
# Home chrome is always `app-drawer-menu-button`. Create Account only
# exists on the guest My tab, so wait for the drawer first, retry close
# if the modal is still up, then pin My.
- repeat:
    times: 15
    while:
      notVisible:
        id: app-drawer-menu-button
    commands:
      - runFlow:
          when:
            visible:
              id: onboarding-close-button
          commands:
            - tapOn:
                id: onboarding-close-button
                waitToSettleTimeoutMs: 0
      - runFlow:
          when:
            visible: Continue
            notVisible: I agree
          commands:
            - tapOn: Continue
      - runFlow:
          when:
            visible: Toggle performance monitor
          commands:
            - swipe:
                direction: DOWN
# Closing the RN Modal by unmounting it can leave an empty Dialog that
# hides the hamburger. Restarting the process (keep zustand) dismisses it.
- runFlow:
    when:
      notVisible:
        id: app-drawer-menu-button
    commands:
      - stopApp
      - launchApp:
          clearState: false
          stopApp: false
          permissions:
            android.permission.RECORD_AUDIO: allow
            microphone: allow
      - runFlow:
          when:
            true: ${output.useDevClient}
          commands:
            - openLink: ${MAESTRO_DEV_CLIENT_URL}
      - repeat:
          times: 15
          while:
            notVisible:
              id: app-drawer-menu-button
          commands:
            - runFlow:
                when:
                  visible: Terms & Privacy
                commands:
                  - scrollUntilVisible:
                      element: I agree
                  - tapOn:
                      text: I agree
                      waitToSettleTimeoutMs: 0
            - runFlow:
                when:
                  visible:
                    id: onboarding-close-button
                commands:
                  - tapOn:
                      id: onboarding-close-button
                      waitToSettleTimeoutMs: 0
            - runFlow:
                when:
                  visible: Continue
                  notVisible: I agree
                commands:
                  - tapOn: Continue
            - runFlow:
                when:
                  visible: Toggle performance monitor
                commands:
                  - swipe:
                      direction: DOWN
- extendedWaitUntil:
    visible:
      id: app-drawer-menu-button
    timeout: 45000
- tapOn:
    id: projects-tab-my
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: Create Account
    timeout: 30000
