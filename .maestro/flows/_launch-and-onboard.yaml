appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      android.permission.RECORD_AUDIO: allow
      microphone: allow
# Development client only. clearState wipes the last Metro URL, so the
# Expo Dev Launcher / Dev Menu opens instead of LangQuest. EAS preview
# and production builds skip this (MAESTRO_USE_DEV_CLIENT is unset).
- evalScript: ${output.useDevClient = typeof MAESTRO_USE_DEV_CLIENT !== 'undefined' && String(MAESTRO_USE_DEV_CLIENT) === 'true'}
- evalScript: ${output.launchLanded = false}
- evalScript: ${output.needsTerms = false}
- evalScript: ${output.launchSpin = 0}
- runFlow:
    when:
      true: ${output.useDevClient}
    commands:
      - openLink: ${MAESTRO_DEV_CLIENT_URL}
# Reach a known screen (Terms, hamburger, or Connecting). `when: visible`
# is one snapshot; without a beat the loop finishes while Metro is still
# compiling and the Terms assert fails. Already-onboarded (hamburger)
# skips Terms. Empty launcher after airplane gets another deep link.
- repeat:
    times: 45
    while:
      true: ${!output.launchLanded}
    commands:
      - evalScript: ${output.launchSpin = output.launchSpin + 1}
      - runFlow:
          when:
            visible:
              id: terms-screen
          commands:
            - evalScript: ${output.launchLanded = true}
            - evalScript: ${output.needsTerms = true}
      - runFlow:
          when:
            visible:
              id: app-drawer-menu-button
          commands:
            - evalScript: ${output.launchLanded = true}
            - evalScript: ${output.needsTerms = false}
      - runFlow:
          when:
            visible: '(?i)Connecting to the development server.*'
          commands:
            - extendedWaitUntil:
                notVisible: '(?i)Connecting to the development server.*'
                timeout: 90000
      - runFlow:
          when:
            visible: '(?i)Fetch development servers'
          commands:
            - openLink: ${MAESTRO_DEV_CLIENT_URL}
      - runFlow:
          when:
            visible: 'http://.*'
          commands:
            - tapOn: 'http://.*'
      - runFlow:
          when:
            visible: Continue
            notVisible: I agree
          commands:
            - tapOn: Continue
      - runFlow:
          when:
            visible: Toggle performance monitor
          commands:
            - swipe:
                direction: DOWN
      - runFlow:
          when:
            platform: iOS
            visible: 'Open in .*'
          commands:
            - tapOn: Cancel
      - runFlow:
          when:
            true: ${output.useDevClient && !output.launchLanded && output.launchSpin > 4}
          commands:
            - openLink: ${MAESTRO_DEV_CLIENT_URL}
            - evalScript: ${output.launchSpin = 0}
      - runFlow:
          when:
            true: ${!output.launchLanded}
          commands:
            - waitForAnimationToEnd:
                timeout: 2000
- runFlow:
    when:
      true: ${!output.launchLanded}
    commands:
      - assertVisible:
          id: terms-screen
- runFlow:
    when:
      true: ${output.needsTerms}
    commands:
      - scrollUntilVisible:
          element: I agree
      - tapOn:
          text: I agree
          waitToSettleTimeoutMs: 0
      # Do not assert onboarding copy. It is gone if the modal already
      # closed. Wait for the close control or home chrome.
      - repeat:
          times: 15
          while:
            notVisible:
              id: app-drawer-menu-button
          commands:
            - runFlow:
                when:
                  visible:
                    id: onboarding-close-button
                commands:
                  - tapOn:
                      id: onboarding-close-button
                      waitToSettleTimeoutMs: 0
            - runFlow:
                when:
                  visible: Continue
                  notVisible: I agree
                commands:
                  - tapOn: Continue
            - runFlow:
                when:
                  visible: Toggle performance monitor
                commands:
                  - swipe:
                      direction: DOWN
            - waitForAnimationToEnd:
                timeout: 1000
# Home chrome is always `app-drawer-menu-button`. Create Account only
# exists on the guest My tab, so wait for the drawer first, retry close
# if the modal is still up, then pin My.
- repeat:
    times: 15
    while:
      notVisible:
        id: app-drawer-menu-button
    commands:
      - runFlow:
          when:
            visible:
              id: onboarding-close-button
          commands:
            - tapOn:
                id: onboarding-close-button
                waitToSettleTimeoutMs: 0
      - runFlow:
          when:
            visible: Continue
            notVisible: I agree
          commands:
            - tapOn: Continue
      - runFlow:
          when:
            visible: Toggle performance monitor
          commands:
            - swipe:
                direction: DOWN
# Closing onboarding must leave home chrome visible. Do not restart the
# process to dismiss a leftover Android Dialog.
- extendedWaitUntil:
    visible:
      id: app-drawer-menu-button
    timeout: 45000
- tapOn:
    id: projects-tab-my
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: Create Account
    timeout: 30000
