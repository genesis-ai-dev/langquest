appId: ${MAESTRO_APP_ID}
---
# iOS Keychain "Save Password?" sits on top of home after sign-in and
# hides projects-create-button. Not Now leaves the device clean for the
# next account on the same simulator.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 8
          while:
            notVisible:
              id: projects-create-button
          commands:
            - runFlow:
                when:
                  visible: Save Password?
                commands:
                  - tapOn: Not Now
            - runFlow:
                when:
                  visible: Not Now
                  notVisible:
                    id: projects-create-button
                commands:
                  - tapOn: Not Now
