appId: ${MAESTRO_APP_ID}
---
# The assets list stays mounted under the recording session, so leaving
# shows the pre-session snapshot. Refresh picks up new takes. iOS Back
# does not exist; nav-back is the session close.
- tapOn:
    id: nav-back
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: assets-refresh-button
    timeout: 20000
- tapOn:
    id: assets-refresh-button
    waitToSettleTimeoutMs: 0
