appId: ${MAESTRO_APP_ID}
---
# Expo's Dev Menu FAB defaults to the top-right, on top of the drawer
# button. clearState resets it there every run. Drag it down the right
# edge (it snaps to that edge) so the drawer tap hits the app, not Expo.
# Park on the left mid-screen. The FAB snaps to an edge; the right
# edge covers the hamburger (top), settings-merge (toggle on the
# right), recording-action-replace (card chrome), and batch-delete
# (footer). Preview/production skip this (MAESTRO_USE_DEV_CLIENT
# is unset).
#
# Leftover discovery (or another sheet) can swallow the first hamburger
# tap after a deep link. Retry until drawer-projects is actually open;
# do not use Back to dismiss sheets (that pops the screen).
- runFlow:
    when:
      true: ${output.useDevClient}
    commands:
      - swipe:
          start: 94%, 8%
          end: 6%, 60%
          duration: 500
- runFlow:
    when:
      visible: Toggle performance monitor
    commands:
      - swipe:
          direction: DOWN
# Airplane mid-init (or Expo losing Metro) shows this alert over the
# hamburger. Dismiss it so the drawer tap can land.
- runFlow:
    when:
      visible: Initialization Error
    commands:
      - tapOn: OK
- repeat:
    times: 4
    while:
      notVisible:
        id: drawer-projects
    commands:
      - tapOn:
          id: app-drawer-menu-button
          waitToSettleTimeoutMs: 0
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: drawer-projects
    timeout: 15000
