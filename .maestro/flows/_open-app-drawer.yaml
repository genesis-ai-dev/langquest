appId: ${MAESTRO_APP_ID}
---
# Expo's Dev Menu FAB defaults to the top-right, on top of the drawer
# button. clearState resets it there every run. Drag it down the right
# edge (it snaps to that edge) so the drawer tap hits the app, not Expo.
# Preview/production builds skip this (MAESTRO_USE_DEV_CLIENT is unset).
#
# Leftover discovery (or another sheet) can swallow the first hamburger
# tap after a deep link. Retry until drawer-projects is actually open;
# do not use Back to dismiss sheets (that pops the screen).
- runFlow:
    when:
      true: ${output.useDevClient}
    commands:
      - swipe:
          start: 94%, 8%
          end: 94%, 78%
          duration: 500
- runFlow:
    when:
      visible: Toggle performance monitor
    commands:
      - swipe:
          direction: DOWN
- repeat:
    times: 4
    while:
      notVisible:
        id: drawer-projects
    commands:
      - tapOn:
          id: app-drawer-menu-button
          waitToSettleTimeoutMs: 0
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: drawer-projects
    timeout: 15000
