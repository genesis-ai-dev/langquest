appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
---
# Signed-in: change password, relaunch keeps session, restore deleted
# account, then logout from the deleted overlay.
- evalScript: ${output.newPassword = output.api.uniquePassword("changed")}
- evalScript: ${output.skipSignInCleanup = true}
- runFlow: _start-signed-in.yaml
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-profile
    waitToSettleTimeoutMs: 0
- scrollUntilVisible:
    element: Current Password
    direction: DOWN
- tapOn: Current Password
- inputText: ${output.signInPassword}
- runFlow: _hide-keyboard.yaml
- tapOn: New Password
- inputText: ${output.newPassword}
- runFlow: _hide-keyboard.yaml
- tapOn: Confirm Password
- inputText: ${output.newPassword}
- runFlow: _hide-keyboard.yaml
- tapOn:
    text: Submit
    below: Confirm Password
- extendedWaitUntil:
    visible: OK
    timeout: 20000
- tapOn: OK
- evalScript: ${output.signInPassword = output.newPassword}
# Let the new session persist before stopApp. Immediate kill on iOS can
# leave SpringBoard after launchApp.
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _relaunch-keep-state.yaml
- evalScript: ${output.api.setProfileActive(output.signInEmail, false)}
- extendedWaitUntil:
    visible: Account Deleted
    timeout: 45000
- tapOn: Restore Account
- runFlow: _confirm-restore-account.yaml
- extendedWaitUntil:
    visible: OK
    timeout: 60000
- tapOn: OK
# iOS can leave the process after PowerSync reinit on restore. Relaunch
# keeps the session and lands on home chrome.
- runFlow:
    when:
      notVisible:
        id: app-drawer-menu-button
    commands:
      - runFlow: _relaunch-keep-state.yaml
- extendedWaitUntil:
    visible:
      id: app-drawer-menu-button
    timeout: 30000
- evalScript: ${output.api.setProfileActive(output.signInEmail, true)}
- evalScript: ${output.api.waitForProfileActive(output.signInEmail, true)}
- evalScript: ${output.api.setProfileActive(output.signInEmail, false)}
- extendedWaitUntil:
    visible: Account Deleted
    timeout: 45000
- tapOn: Back to Login
- extendedWaitUntil:
    visible:
      id: home-sign-in
    timeout: 30000
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
