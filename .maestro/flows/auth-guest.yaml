appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  - runFlow: _recover-after-airplane.yaml
---
# Guest landing: My Projects Sign In CTA, dismiss back to guest home,
# offline sign-in gate, forgot-password confirmation, wrong password error.
- evalScript: ${output.signInEmail = output.api.uniqueEmail("guestauth")}
- evalScript: ${output.signInPassword = output.api.uniquePassword("guestauth")}
- evalScript: ${output.api.createConfirmedUser(output.signInEmail, output.signInPassword)}
- runFlow: _launch-and-onboard.yaml
- tapOn:
    id: projects-tab-my
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: home-sign-in
    timeout: 15000
- assertVisible:
    id: home-sign-in
- tapOn:
    id: home-sign-in
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 15000
# Auth is a form sheet. The hamburger behind it must not be in the tree.
- assertNotVisible:
    id: app-drawer-menu-button
- runFlow: _open-auth-language.yaml
- tapOn:
    id: auth-sheet-close
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: home-sign-in
    timeout: 15000
- tapOn:
    id: home-sign-in
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible: Internet connection required
          timeout: 15000
      - assertVisible:
          text: Sign In
          below: I forgot my password
          enabled: false
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible: Internet connection required
          timeout: 20000
- tapOn: I forgot my password
- extendedWaitUntil:
    visible: Send Reset Email
    timeout: 15000
- tapOn: Enter your email to reset your password
- eraseText
- inputText: ${output.signInEmail}
- runFlow: _hide-keyboard.yaml
- tapOn: Send Reset Email
- extendedWaitUntil:
    visible: Please check your email for the password reset link
    timeout: 20000
- tapOn:
    id: forgot-password-ok
    waitToSettleTimeoutMs: 0
# Confirmation returns to sign-in. Back to Login must not still be on screen.
- extendedWaitUntil:
    notVisible: Back to Login
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 15000
# Back to Login already fills the email. Re-typing it concatenates and
# Zod rejects the field, so the Error alert never appears.
- tapOn:
    id: sign-in-password
    waitToSettleTimeoutMs: 0
- eraseText
- inputText: wrong-password
- runFlow: _hide-keyboard.yaml
- tapOn:
    id: sign-in-submit
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: Invalid login credentials
    timeout: 15000
- tapOn: OK
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
