appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  - setAirplaneMode: disabled
---
# Invite accept is blocked offline. Request access and project report still
# write locally and land after radios return. Stay on the private-project
# screen when cutting radios so the gate does not depend on a cloud refetch.
# Android only — iOS Simulator has no airplane mode.
- evalScript: ${output.ownerEmail = output.api.uniqueEmail("offmemowner")}
- evalScript: ${output.ownerPassword = output.api.uniquePassword("offmemowner")}
- evalScript: ${output.privateName = "maestro-offpriv-" + Date.now()}
- evalScript: ${output.publicName = "maestro-offpub-" + Date.now()}
- evalScript: ${output.inviteProject = "maestro-offinv-" + Date.now()}
- evalScript: ${output.reportDetails = "maestro-off-report-" + Date.now()}
- evalScript: ${output.skipSignInCleanup = true}
- evalScript: ${output.api.createConfirmedUser(output.ownerEmail, output.ownerPassword)}
- evalScript: ${output.api.seedProject(output.privateName, output.ownerEmail, true)}
- evalScript: ${output.api.seedProject(output.publicName, output.ownerEmail, false)}
- evalScript: ${output.api.seedProject(output.inviteProject, output.ownerEmail, false)}
- runFlow: _start-signed-in.yaml
- evalScript: ${output.api.seedInvite(output.inviteProject, output.ownerEmail, output.signInEmail)}
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-notifications
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: notification-invite-accept
    timeout: 45000
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-projects
    waitToSettleTimeoutMs: 0
- tapOn:
    id: projects-tab-all
- tapOn:
    id: projects-search
- inputText: ${output.privateName}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.privateName}
    timeout: 45000
- tapOn:
    text: ${output.privateName}
    below:
      id: projects-search
- extendedWaitUntil:
    visible:
      id: project-request-access
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: project-request-access
      - extendedWaitUntil:
          visible: Request Membership
          timeout: 15000
      - tapOn: Request Membership
      - extendedWaitUntil:
          visible: Success
          timeout: 20000
      - tapOn: OK
      - runFlow: _open-app-drawer.yaml
      - tapOn:
          id: drawer-notifications
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible:
            id: notifications-offline
          timeout: 15000
      - tapOn:
          id: notification-invite-accept
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible: You must be online to accept an invitation
          timeout: 15000
      - tapOn: OK
      - runFlow: _open-app-drawer.yaml
      - tapOn:
          id: drawer-projects
          waitToSettleTimeoutMs: 0
      - tapOn:
          id: projects-tab-all
      - tapOn:
          id: projects-search
      - inputText: ${output.publicName}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.publicName}
          timeout: 20000
      - tapOn:
          text: ${output.publicName}
          below:
            id: projects-search
      - extendedWaitUntil:
          visible:
            id: project-speed-dial
          timeout: 20000
      - tapOn:
          id: project-speed-dial
      - extendedWaitUntil:
          visible:
            id: project-report
          timeout: 15000
      - tapOn:
          id: project-report
      - extendedWaitUntil:
          visible:
            id: report-reason-spam
          timeout: 15000
      - tapOn:
          id: report-reason-spam
      - tapOn:
          id: report-details
      - inputText: ${output.reportDetails}
      - tapOn:
          id: report-reason-spam
      - extendedWaitUntil:
          visible:
            id: report-submit
          timeout: 15000
      - tapOn:
          id: report-submit
      - extendedWaitUntil:
          visible: Success
          timeout: 30000
      - tapOn: OK
      - setAirplaneMode: disabled
      - evalScript: ${output.api.waitForRequest(output.privateName, output.signInEmail, "pending", 45000)}
      - evalScript: ${output.api.waitForReport(output.reportDetails, 45000)}
      - evalScript: ${output.api.waitForInvite(output.inviteProject, output.signInEmail, "pending", 15000)}
- evalScript: ${output.api.deleteProject(output.privateName)}
- evalScript: ${output.api.deleteProject(output.publicName)}
- evalScript: ${output.api.deleteProject(output.inviteProject)}
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
- evalScript: ${output.api.deleteUserIfExists(output.ownerEmail)}
