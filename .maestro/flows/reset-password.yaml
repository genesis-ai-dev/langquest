appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  - evalScript: ${output.api.deleteUserIfExists(output.resetEmail)}
---
# Reset Password Test Flow
# 1. Create a throwaway confirmed user (Android and iOS must not share one)
# 2. Generate reset link via admin API
# 3. Open reset link (deep link)
# 4. Enter a new password that differs from the throwaway's initial password
# 5. Verify the user is logged in
# 6. Delete the throwaway user
#
# Usage: maestro test -e MAESTRO_APP_ID=com.etengenesis.langquest.preview reset-password.yaml

- evalScript: ${output.resetEmail = output.api.uniqueEmail("reset")}
- evalScript: ${output.initialPassword = output.api.uniquePassword("reset-init")}
- evalScript: ${output.newPassword = output.api.uniquePassword("reset")}
- evalScript: ${output.api.createConfirmedUser(output.resetEmail, output.initialPassword)}
- evalScript: ${output.resetLink = output.api.generatePasswordResetLink(output.resetEmail)}

- runFlow:
    file: _launch-and-onboard.yaml
- openLink:
    link: ${output.resetLink}
    autoVerify: true

- runFlow:
    when:
      platform: iOS
    file: _ios-dismiss-safari-bookmark-popover.yaml

- runFlow:
    when:
      visible: 'Open this page in.*'
    commands:
      - tapOn: Open

- runFlow:
    when:
      visible: 'Open in.*'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible: Create New Password
    timeout: 20000
- tapOn: New Password
- inputText: ${output.newPassword}
- tapOn: Confirm Password
- inputText: ${output.newPassword}
- tapOn:
    point: 95%,30%
- tapOn: Update Password

# Success alert can auto-dismiss after the recovery session becomes a login.
- runFlow:
    when:
      visible: Success
    commands:
      - tapOn: OK
- runFlow:
    when:
      visible: Create New Password
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    notVisible: Create New Password
    timeout: 20000
# Same post-auth check as sign-in / register: drawer id, then Profile
# above the email. `tapOn: Profile` misses on iOS (the row is drawer-profile).
- runFlow: _open-app-drawer.yaml
- extendedWaitUntil:
    visible:
      id: drawer-profile
    timeout: 30000
- tapOn:
    id: drawer-profile
    waitToSettleTimeoutMs: 0
- assertVisible:
    text: Profile
    above:
      text: ${output.resetEmail}
