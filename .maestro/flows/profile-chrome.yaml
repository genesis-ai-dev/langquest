appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
---
# 4.8 drawer destinations, 4.7 feedback, 4.9 terms, then 4.4 language
# (language last so English copy stays valid). Feedback is at the top of
# Profile; terms is at the bottom — do feedback before scrolling down.
- evalScript: ${output.feedbackTitle = "maestro-fb-" + Date.now()}
- evalScript: ${output.skipSignInCleanup = true}
- runFlow: _start-signed-in.yaml
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-profile
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: profile-feedback
    timeout: 15000
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-settings
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: Settings
    timeout: 15000
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-notifications
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: Notifications
    timeout: 15000
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-projects
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: projects-create-button
    timeout: 15000
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-profile
    waitToSettleTimeoutMs: 0
- tapOn:
    id: profile-feedback
- tapOn:
    id: feedback-title
- inputText: ${output.feedbackTitle}
- runFlow: _hide-keyboard.yaml
- tapOn:
    id: feedback-description
- inputText: maestro-feedback-body
- runFlow: _hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: feedback-submit
    direction: DOWN
    centerElement: true
- tapOn:
    id: feedback-submit
- extendedWaitUntil:
    visible: Success
    timeout: 30000
- tapOn: OK
- evalScript: ${output.api.waitForFeedback(output.feedbackTitle, 45000)}
- extendedWaitUntil:
    visible: Submit Feedback
    timeout: 15000
- scrollUntilVisible:
    element: View Terms and Privacy
    direction: DOWN
- tapOn: View Terms and Privacy
- extendedWaitUntil:
    visible: Terms & Privacy
    timeout: 15000
- tapOn: Close
- extendedWaitUntil:
    visible: View Terms and Privacy
    timeout: 15000
# Profile uses LanguageCombobox (same as Sign In / New Project). Search,
# then tap id: Tok Pisin — the list row, not the search field text.
- scrollUntilVisible:
    element:
      id: profile-language
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: profile-language
    waitToSettleTimeoutMs: 0
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _tap-language-search.yaml
- inputText: Tok Pisin
- extendedWaitUntil:
    visible:
      id: Tok Pisin
    timeout: 20000
- tapOn:
    id: Tok Pisin
    waitToSettleTimeoutMs: 0
- runFlow: _wait-language-search-gone.yaml
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: profile-submit
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    id: profile-submit
- extendedWaitUntil:
    visible: OK
    timeout: 20000
- tapOn: OK
- runFlow: _relaunch-keep-state.yaml
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-projects
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: projects-create-button
    timeout: 15000
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
