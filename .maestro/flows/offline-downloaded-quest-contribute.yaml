appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  - runFlow: _recover-after-airplane.yaml
---
# Download a published quest online, then open it with radios down.
# The device user is not a member, so tapping either quest opens the
# cloud assets (no Download Now); the download goes through the quest header.
# Published quests hide Record; this is the field-read path.
# Android only — iOS Simulator has no airplane mode.
- evalScript: ${output.ownerEmail = output.api.uniqueEmail("offdlowner")}
- evalScript: ${output.ownerPassword = output.api.uniquePassword("offdlowner")}
- evalScript: ${output.projectName = "maestro-offdl-" + Date.now()}
- evalScript: ${output.questName = "maestro-offdl-q-" + Date.now()}
- evalScript: ${output.cloudQuestName = "maestro-offdl-cloud-" + Date.now()}
- evalScript: ${output.assetName = "maestro-offdl-a-" + Date.now()}
- evalScript: ${output.skipSignInCleanup = true}
- evalScript: ${output.api.createConfirmedUser(output.ownerEmail, output.ownerPassword)}
- evalScript: ${output.api.seedProject(output.projectName, output.ownerEmail, false)}
- evalScript: ${output.api.seedQuest(output.projectName, output.questName, output.ownerEmail, true)}
- evalScript: ${output.api.seedSourceAsset(output.projectName, output.questName, output.ownerEmail, output.assetName, "Offline source")}
- runFlow: _start-signed-in.yaml
- tapOn:
    id: projects-tab-all
- tapOn:
    id: projects-search
- inputText: ${output.projectName}
- runFlow: _hide-keyboard.yaml
- extendedWaitUntil:
    visible: ${output.projectName}
    timeout: 45000
- tapOn:
    text: ${output.projectName}
    below:
      id: projects-search
- extendedWaitUntil:
    visible: ${output.questName}
    timeout: 45000
# Seed the sibling only after this download; the helper opens the only
# quest row.
- runFlow: _download-quest-from-header.yaml
- evalScript: ${output.api.waitForQuestDownload(output.questName, output.signInEmail, true)}
- evalScript: ${output.api.seedQuest(output.projectName, output.cloudQuestName, output.ownerEmail, true)}
# The directory already loaded this project. A quest the device has not
# downloaded is absent from PowerSync, so the cloud list has to be refreshed.
# Preview binaries built before quests-refresh existed have the icon with no
# id. Those points are the icon center on the preview simulator and emulator.
- runFlow:
    when:
      visible:
        id: quests-refresh
    commands:
      - tapOn:
          id: quests-refresh
- runFlow:
    when:
      notVisible:
        id: quests-refresh
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                point: '52%,16%'
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: '53%,18%'
- extendedWaitUntil:
    visible: ${output.cloudQuestName}
    timeout: 45000
- tapOn:
    text: ${output.questName}
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: assets-refresh-button
    timeout: 45000
- tapOn:
    id: nav-back
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: ${output.cloudQuestName}
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          text: ${output.questName}
      - extendedWaitUntil:
          visible:
            id: assets-refresh-button
          timeout: 20000
      - tapOn:
          id: assets-refresh-button
      - extendedWaitUntil:
          visible: ${output.assetName}
          timeout: 20000
      - tapOn:
          id: nav-back
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible: ${output.cloudQuestName}
          timeout: 20000
      - tapOn:
          text: ${output.cloudQuestName}
      - extendedWaitUntil:
          visible:
            id: assets-refresh-button
          timeout: 20000
      - assertNotVisible: '(?i)Download Now'
      - tapOn:
          id: nav-back
          waitToSettleTimeoutMs: 0
      - setAirplaneMode: disabled
- evalScript: ${output.api.deleteProject(output.projectName)}
- evalScript: ${output.api.deleteUserIfExists(output.signInEmail)}
- evalScript: ${output.api.deleteUserIfExists(output.ownerEmail)}
