appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
  # Make sign-in independent of reset-password leftover state.
  - evalScript: ${output.api.updateUserPassword(MAESTRO_TEST_EMAIL, MAESTRO_TEST_PASSWORD)}
---
# - runFlow:
#     when:
#       platform: iOS
#     file: _ios-toggle-autofill-passwords.yaml
- runFlow: _launch-and-onboard.yaml
- tapOn:
    text: Sign In
    index: -1
- tapOn:
    id: sign-in-email
- eraseText
- inputText: ${MAESTRO_TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: sign-in-password
- eraseText
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    text: Sign In
    below: I forgot my password
- tapOn:
    id: app-drawer-menu-button
- tapOn: Profile
- assertVisible:
    text: Profile
    above:
      text: ${MAESTRO_TEST_EMAIL}
