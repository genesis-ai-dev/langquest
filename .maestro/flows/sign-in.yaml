appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  # create-records.yaml sets skipSignInCleanup so it can keep using this session.
  - evalScript: ${output.skipSignInCleanup !== true && output.api.deleteUserIfExists(output.signInEmail)}
---
- runFlow: _start-signed-in.yaml
- runFlow: _open-app-drawer.yaml
- tapOn:
    id: drawer-profile
    waitToSettleTimeoutMs: 0
- assertVisible:
    text: Profile
    above:
      text: ${output.signInEmail}
