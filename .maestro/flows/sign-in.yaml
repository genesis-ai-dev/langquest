appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runScript: ../api.js
onFlowComplete:
  # Throwaway user — never share MAESTRO_TEST_EMAIL across iOS/Android/jobs.
  # create-records.yaml sets skipSignInCleanup so it can keep using this session.
  - evalScript: ${output.skipSignInCleanup !== true && output.api.deleteUserIfExists(output.signInEmail)}
---
# Sign in with a throwaway user. iOS and Android Maestro jobs run in parallel
# against the same Supabase project; sharing test@langquest.org caused
# "Invalid login credentials" and GoTrue same_password errors.

# - runFlow:
#     when:
#       platform: iOS
#     file: _ios-toggle-autofill-passwords.yaml
- evalScript: ${output.signInEmail = output.api.uniqueEmail("signin")}
- evalScript: ${output.signInPassword = output.api.uniquePassword("signin")}
- evalScript: ${output.api.createConfirmedUser(output.signInEmail, output.signInPassword)}
- runFlow: _launch-and-onboard.yaml
- tapOn:
    text: Sign In
    index: -1
- tapOn:
    id: sign-in-email
- eraseText
- inputText: ${output.signInEmail}
- hideKeyboard
- tapOn:
    id: sign-in-password
- eraseText
- inputText: ${output.signInPassword}
- hideKeyboard
- tapOn:
    text: Sign In
    below: I forgot my password
- tapOn:
    id: app-drawer-menu-button
- tapOn: Profile
- assertVisible:
    text: Profile
    above:
      text: ${output.signInEmail}
