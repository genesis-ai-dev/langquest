appId: ${MAESTRO_APP_ID}
---
# iOS password fields steal keystrokes for the Strong Password sheet.
# Dismiss it so Maestro can type or paste a chosen password.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: Other Options
          commands:
            - tapOn: Other Options
      - runFlow:
          when:
            visible: Choose My Own Password
          commands:
            - tapOn: Choose My Own Password
      - runFlow:
          when:
            visible: Not Now
          commands:
            - tapOn: Not Now
      - runFlow:
          when:
            visible: Use Strong Password
          commands:
            - tapOn:
                text: '(?i)(Not Now|Choose My Own Password|Other Options.*)'
